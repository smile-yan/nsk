name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fast, deterministic dependency resolution.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  linux-tests:
    name: tests (linux, full isolation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Workspace tests
        run: cargo test --workspace
      - name: Linux isolation & security acceptance (§20.2)
        run: cargo test -p nsk-provider-linux --test isolation_linux -- --test-threads=1
      - name: Stress (bounded)
        run: cargo test -p nsk-runtime --test stress -- --ignored --test-threads=1
        env:
          NSK_STRESS_ITERS: 200

  macos-tests:
    name: tests (macOS, core + mock)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Linux provider must at least compile on macOS hosts; the probe
      # reports honestly instead of pretending.
      - run: cargo test --workspace
      - run: cargo build -p nsk-cli

  windows-build:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows provider is a fail-closed stub in phase 1; the workspace
      # must still build cleanly.
      - run: cargo build --workspace
      - run: cargo test -p nsk-core -p nsk-policy -p nsk-resource -p nsk-workspace
