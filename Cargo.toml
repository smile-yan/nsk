[workspace]
resolver = "2"

members = [
    "crates/nsk-core",
    "crates/nsk-policy",
    "crates/nsk-runtime",
    "crates/nsk-supervisor",
    "crates/nsk-resource",
    "crates/nsk-workspace",
    "crates/nsk-provider",
    "crates/nsk-provider-linux",
    "crates/nsk-provider-macos",
    "crates/nsk-provider-windows",
    "crates/nsk-scheduler",
    "crates/nsk-cli",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/smile-yan/nsk"
authors = ["NSK contributors"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Kernel code must never panic on the hot path; tests are exempted via allow attrs where needed.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Internal crates
# version 与 path 并存：workspace 内按 path 解析，发布到 crates.io 时按 version 解析。
nsk-core = { path = "crates/nsk-core", version = "0.1.0" }
nsk-policy = { path = "crates/nsk-policy", version = "0.1.0" }
nsk-runtime = { path = "crates/nsk-runtime", version = "0.1.0" }
nsk-supervisor = { path = "crates/nsk-supervisor", version = "0.1.0" }
nsk-resource = { path = "crates/nsk-resource", version = "0.1.0" }
nsk-workspace = { path = "crates/nsk-workspace", version = "0.1.0" }
nsk-provider = { path = "crates/nsk-provider", version = "0.1.0" }
nsk-provider-linux = { path = "crates/nsk-provider-linux", version = "0.1.0" }
nsk-provider-macos = { path = "crates/nsk-provider-macos", version = "0.1.0" }
nsk-provider-windows = { path = "crates/nsk-provider-windows", version = "0.1.0" }
nsk-scheduler = { path = "crates/nsk-scheduler", version = "0.1.0" }
nsk-cli = { path = "crates/nsk-cli", version = "0.1.0" }

# External dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
libc = "0.2"

tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "process",
    "time",
    "macros",
    "io-util",
    "signal",
    "fs",
] }

tokio-util = { version = "0.7", features = ["rt"] }

# Dev / CLI
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
